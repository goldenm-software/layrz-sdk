name: "Lint check"

on:
  pull_request:
    branches: [ main, next, development ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-actions/.github/actions/check-python@v1
        id: check-python
        with:
          working-directory: ./python
          run-type-check: true
          run-tests: true
          coverage-library: 'layrz_sdk'
          artifact-name: 'python-coverage-${{ github.run_id }}'
  
  lint-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-actions/.github/actions/check-dart@v1
        id: check-dart
        with:
          working-directory: ./dart
          flutter-version: 3.47.0
          run-checks: true
          run-tests: false

  test-dart:
    runs-on: ubuntu-latest
    needs: [lint-dart]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.0
          cache: true
          cache-sdk: true
          cache-key: ${{ runner.os }}-flutter-${{ hashFiles('dart/pubspec.yaml') }}

      - name: Install dependencies
        working-directory: ./dart
        run: flutter pub get

      - name: Run tests (shard ${{ matrix.shard }} of 8)
        working-directory: ./dart
        run: |
          FILES=$(find test -name '*_test.dart' | sort | awk "NR % 8 == ${{ matrix.shard }}")
          flutter test --machine --coverage $FILES 2>&1 | tee test-results.json; exit ${PIPESTATUS[0]}

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests (shard ${{ matrix.shard }})
          path: dart/test-results.json
          reporter: flutter-json

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: dart/coverage/lcov.info
          retention-days: 1

  merge-dart-coverage:
    runs-on: ubuntu-latest
    needs: [test-dart]
    steps:
      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dart-coverage-shard-*-${{ github.run_id }}
          path: shards

      - name: Merge shard coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          mkdir -p dart-coverage
          ARGS=""
          for f in shards/*/lcov.info; do ARGS="$ARGS -a $f"; done
          lcov $ARGS -o dart-coverage/lcov.info

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage-${{ github.run_id }}
          path: dart-coverage/lcov.info
          retention-days: 1

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: goldenm-software/layrz-actions/.github/actions/check-go@v1
        id: check-go
        with:
          working-directory: ./go
          go-version: '1.27.0'
          run-tests: true
          artifact-name: 'go-coverage-${{ github.run_id }}'

  coverage:
    needs: [lint-python, lint-go, lint-dart, merge-dart-coverage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-coverage-${{ github.run_id }}
          path: python-coverage

      - name: Download Go coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-coverage-${{ github.run_id }}
          path: go-coverage

      - name: Download Dart coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: dart-coverage-${{ github.run_id }}
          path: dart-coverage

      - uses: goldenm-software/layrz-actions/.github/actions/coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-python: true
          python-coverage-path: python-coverage/lcov.info
          enable-go: true
          go-coverage-path: go-coverage/lcov.info
          enable-dart: true
          dart-coverage-path: dart-coverage/lcov.info

      - uses: goldenm-software/layrz-actions/.github/actions/coverage-check@v1
        with:
          enable-python: true
          python-coverage-path: python-coverage/lcov.info
          enable-go: true
          go-coverage-path: go-coverage/lcov.info
          enable-dart: true
          dart-coverage-path: dart-coverage/lcov.info
          threshold: 70

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: goldenm-software/layrz-actions/.github/actions/changelog@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: true
